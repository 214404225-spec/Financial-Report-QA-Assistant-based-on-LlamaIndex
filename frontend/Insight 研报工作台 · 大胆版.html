<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insight · 研报分析工作台 · 大胆版</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/variant-c.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--paper); overflow: hidden; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script>
  // 给所有外部脚本拼一个时间戳，开发期防 304 缓存。生产环境可改回固定版本号。
  const _v = Date.now();
  document.write(`<script src="data/mock.js?v=${_v}"><\/script>`);
  document.write(`<script src="data/api.js?v=${_v}"><\/script>`);
  document.write(`<script type="text/babel" src="tweaks-panel.jsx?v=${_v}"><\/script>`);
  document.write(`<script type="text/babel" src="variants/variant-c.jsx?v=${_v}"><\/script>`);
</script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
  "theme": "light"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULS);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
  }, [tweaks.theme]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTheme = (v) => {
    setTweaks(t => ({ ...t, theme: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: v } }, '*');
  };

  return (
    <>
      <VariantC />
      {visible && (
        <TweaksPanel onClose={() => {
          setVisible(false);
          window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }}>
          <TweakSection title="主题">
            <TweakRadio
              label="明暗模式"
              value={tweaks.theme}
              onChange={updateTheme}
              options={[
                { value: 'light', label: '明亮' },
                { value: 'dark', label: '暗色' },
              ]}
            />
          </TweakSection>
        </TweaksPanel>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
